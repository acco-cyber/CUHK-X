# CUHK-X verification manifest - team Nabid Nur - Large Model Track
schema_version: 2

team:
  name: "Nabid Nur"
  track: "large"
  contact_email: "REPLACE_ME_TEAM_CONTACT_EMAIL"

kaggle_submission_record:
  path: "submission/submission_info.yaml"
  selected_submission_count: 2

solution:
  type: "local_checkpoint"  # JSON model state learned from training questions and durations; no neural network
  entrypoint: "inference.sh"
  primary_config: "configs/final.yaml"
  source_root: "src"
  description: >-
    Structure-aware multiple-choice decoder. Stage 1 text decoder (scene grouping, training-script matching,
    joint constraint decoding; HARn label dynamic programme), stage 2 temporal slot rule, stage 3 joint scene
    consistency, stage 4 singleton emotion count model, stage 5 clip-duration emotion model (MP4 header of
    IR.mp4), stage 6 disclosed rows set by hand (applied only to the original test set). The code is a
    post-deadline consolidation of the research scripts that produced the submissions (README section 2.5).
  execution_order: ["text_decoder", "slot_rule", "scene_joint", "singleton_emotion", "duration_emotion", "disclosed_adjustments"]

environment:
  specification: "environment/requirements.txt"  # intentionally empty: standard library only
  dockerfile: "environment/Dockerfile"            # optional; not built or tested by the team
  docker_image: null                              # Option B (no Docker image supplied)
  operating_system: "Linux x86_64 (tested: glibc 2.35); also tested on Windows 11"
  python_version: "tested: CPython 3.11.9 (Windows), CPython 3.12.13 (Linux)"
  cuda_or_accelerator_version: "NOT_APPLICABLE"
  system_packages: ["bash", "python3"]

hardware:
  gpu_count: 0
  minimum_gpu_memory_gb_per_gpu: 0
  minimum_host_memory_gb: 1
  minimum_free_disk_gb: 0.01
  expected_setup_time: "none if python3 and bash are installed"
  expected_inference_time: "about 1-1.5 s decoding (measured) plus reading 208 IR videos from the zip (estimated a few seconds)"
  tested_hardware: "Windows 11: Intel Core i7-1265U, 31 GB RAM; Linux: Kaggle CPU session"

network:
  required_during_setup: false   # true only for the optional docker build (pulls python:3.11.9-slim-bookworm)
  required_during_inference: false
  allowed_hosts: []
  explanation: "No network is used by the package. The optional Docker build pulls its base image from Docker Hub."

api:
  required: false
  provider: null
  model_and_version: null
  configuration_example: null
  credential_environment_variables: []
  estimated_usage: null

development_services:
  - name: "Claude (Anthropic), via Claude Code, including multi-agent workflows"
    used_for: >-
      code and data analysis; writing and validating the stage 2-5 rules; proposing answers for individual test rows
      (six temporal-order answers of v3, including test_0358); LLM 'judge' probabilities for submission v5 (not Selected)
    affects_selected_rows: ["test_0358"]
    used_at_inference: false

artifacts:
  - name: "model_state.json"
    purpose: "Training-derived model state for stages 1-5 (scene scripts, priors, HARn tables, slot statistics, emotion count model, duration ridge model). Rebuilt byte-identically by src/train.py."
    path: "artifacts/model_state.json"
    source_url: null
    revision_or_version: "1.0.0"
    sha256: "f90c495999a03d9f721fe45ac3ee46cf7aa5d55dea69df961fc95e4f43de9cf4"
    required: true
  - name: "disclosed_adjustments_56255655.json"
    purpose: "DISCLOSED rows of submission 56255655 set by hand, not produced by the model code (3 rows); applied only to the original test set"
    path: "artifacts/disclosed_adjustments_56255655.json"
    source_url: null
    revision_or_version: "1.0.0"
    sha256: "458251c47f0e60bdcb7a9a531df926295dfa826c51a93aaaf72b6db9537d3d44"
    required: true
  - name: "disclosed_adjustments_56261134.json"
    purpose: "DISCLOSED rows of submission 56261134 set by hand, not produced by the model code (4 rows); applied only to the original test set"
    path: "artifacts/disclosed_adjustments_56261134.json"
    source_url: null
    revision_or_version: "1.0.0"
    sha256: "ee6406b9793bdd8517552507bb250484fd4cd7538647f792a0af387bcc4e6946"
    required: true

external_training_data: []  # none. Clip durations come from the official CUHK-X videos (organisers' public Google Drive mirror).

reproducibility:
  random_seeds: []
  precision_mode: "Python float (IEEE-754 double), pure standard library"
  expected_nondeterminism: "none; output is byte-identical to the Kaggle CSVs (verified on Windows and Linux)"
  comparison_notes: "Compare CSV bytes or rows directly. Three rows (test_0343, test_0647, test_0509) are decided by exact or last-bit score ties that were bit-identical on both tested platforms."

inference_input:
  type: "official_label_free_testing_directory"
  path_supplied_by_organizer: true
  published_layout_preserved: true
  participant_preprocessing_included: true

declarations:
  honor_declaration_form: "declarations/CUHK-X_Honor_Declaration.docx"
  signed_declaration: "REPLACE_ME_declarations/CUHK-X_Honor_Declaration_signed.pdf"
  clarification: "declarations/CLARIFICATION.md"
