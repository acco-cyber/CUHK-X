<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .input { fill: #eff6ff; stroke: #3b82f6; }
      .train { fill: #f0fdf4; stroke: #16a34a; }
      .stage { fill: #fff7ed; stroke: #ea580c; }
      .disc { fill: #fef2f2; stroke: #dc2626; stroke-dasharray: 6 4; }
      .out { fill: #f5f3ff; stroke: #7c3aed; }
      .t { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12.5px; fill: #334155; }
      .h { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #16a34a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1180" height="760" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">CUHK-X Large Model Track - structure-aware VQA decoder (team Nabid Nur)</text>
  <text x="30" y="64" class="s">Pure Python, CPU only, no network. Inference = bash inference.sh &lt;data_dir&gt; &lt;output_csv&gt;  (about 2 s + reading the clip videos)</text>

  <!-- training (offline) -->
  <text x="30" y="105" class="h">TRAINING (OFFLINE, src/train.py)</text>
  <rect x="30" y="118" width="250" height="92" rx="10" class="box train"/>
  <text x="46" y="143" class="t">Training/training_qa.csv</text>
  <text x="46" y="164" class="s">4,087 labelled questions,</text>
  <text x="46" y="182" class="s">272 HAU scene scripts, HARn labels</text>
  <text x="46" y="200" class="s">users 1-9 and 16-24</text>

  <rect x="30" y="228" width="250" height="74" rx="10" class="box train"/>
  <text x="46" y="253" class="t">Training/data/HAU.zip</text>
  <text x="46" y="274" class="s">IR.mp4 of 814 clips: duration from</text>
  <text x="46" y="292" class="s">the MP4 movie header (mvhd)</text>

  <rect x="330" y="150" width="270" height="120" rx="10" class="box train"/>
  <text x="346" y="175" class="t">artifacts/model_state.json</text>
  <text x="346" y="196" class="s">scene scripts: actions, adverb per repeat,</text>
  <text x="346" y="214" class="s">temporal precedence closure; priors;</text>
  <text x="346" y="232" class="s">HARn naive-Bayes tables; slot statistics;</text>
  <text x="346" y="250" class="s">emotion count model; duration ridge model</text>
  <path d="M280,164 L328,190" class="dash"/>
  <path d="M280,265 L328,238" class="dash"/>

  <!-- inputs -->
  <text x="660" y="105" class="h">INFERENCE INPUT (&lt;data_dir&gt;)</text>
  <rect x="660" y="118" width="230" height="74" rx="10" class="box input"/>
  <text x="676" y="143" class="t">test_qa.csv</text>
  <text x="676" y="164" class="s">682 questions, 208 clips</text>
  <text x="676" y="182" class="s">(no labels)</text>
  <rect x="910" y="118" width="240" height="74" rx="10" class="box input"/>
  <text x="926" y="143" class="t">clip videos (zip or folders)</text>
  <text x="926" y="164" class="s">only IR.mp4 headers are read</text>
  <text x="926" y="182" class="s">(duration of each recording)</text>

  <!-- stages -->
  <text x="30" y="345" class="h">PIPELINE (src/cuhkx_vqa/pipeline.py)</text>
  <rect x="30" y="358" width="1120" height="84" rx="10" class="box stage"/>
  <text x="46" y="383" class="t">Stage 1 - text decoder (text_decoder.py)</text>
  <text x="46" y="404" class="s">HAU: group consecutive clips (id order) into scenes by shared emotion options, match each scene to a training script, decode single / multi / combination /</text>
  <text x="46" y="422" class="s">sequence / emotion jointly (repeat index from position; two-clip scenes = repeats 2,3).  HARn: label-sorted ids, softly monotone dynamic programme over labels.</text>

  <rect x="30" y="460" width="265" height="118" rx="10" class="box stage"/>
  <text x="46" y="485" class="t">Stage 2 - slot rule</text>
  <text x="46" y="506" class="s">temporal-order questions with</text>
  <text x="46" y="524" class="s">pairs missing from the script:</text>
  <text x="46" y="542" class="s">substitute actions share a slot</text>
  <text x="46" y="560" class="s">(held-out 42/43 pairs)</text>

  <rect x="315" y="460" width="265" height="118" rx="10" class="box stage"/>
  <text x="331" y="485" class="t">Stage 3 - scene consistency</text>
  <text x="331" y="506" class="s">no-script scenes: choose single /</text>
  <text x="331" y="524" class="s">combination answers jointly so no</text>
  <text x="331" y="542" class="s">action is both chosen and rejected</text>
  <text x="331" y="560" class="s">(held-out +100 answers, 3 broken)</text>

  <rect x="600" y="460" width="265" height="118" rx="10" class="box stage"/>
  <text x="616" y="485" class="t">Stage 4 - singleton emotion</text>
  <text x="616" y="506" class="s">one-clip scenes: count model of</text>
  <text x="616" y="524" class="s">P(repeat | adverb) with a manner</text>
  <text x="616" y="542" class="s">lexicon, marginal over repeat 2/3</text>
  <text x="616" y="560" class="s">(held-out 0.497 vs 0.405)</text>

  <rect x="885" y="460" width="265" height="118" rx="10" class="box stage"/>
  <text x="901" y="485" class="t">Stage 5 - duration emotion</text>
  <text x="901" y="506" class="s">no-script scenes: hurried repeat =</text>
  <text x="901" y="524" class="s">shortest clip; ridge model of log</text>
  <text x="901" y="542" class="s">duration x adverb, joint assignment</text>
  <text x="901" y="560" class="s">(held-out 0.76 -&gt; 0.91)</text>

  <path d="M590,442 L162,458" class="line"/>
  <path d="M295,519 L313,519" class="line"/>
  <path d="M580,519 L598,519" class="line"/>
  <path d="M865,519 L883,519" class="line"/>

  <path d="M465,270 L465,300 L200,300 L200,356" class="line"/>
  <path d="M775,192 L775,356" class="line"/>
  <path d="M1030,192 L1030,458" class="line"/>

  <!-- disclosed + output -->
  <rect x="30" y="610" width="620" height="120" rx="10" class="box disc"/>
  <text x="46" y="635" class="t">Stage 6 - DISCLOSED rows set by hand (disclosed_adjustments_*.json)</text>
  <text x="46" y="656" class="s">Answers of the Kaggle submissions that were not produced by the model code:</text>
  <text x="46" y="674" class="s">1 hand-reasoned temporal-order answer and 2 leaderboard-informed emotion answers</text>
  <text x="46" y="692" class="s">(submission 56261134 adds 1 more). Applied ONLY when test_qa.csv is the original test set;</text>
  <text x="46" y="710" class="s">configs/model_only.yaml runs without them.</text>

  <rect x="700" y="610" width="450" height="120" rx="10" class="box out"/>
  <text x="716" y="635" class="t">&lt;output_csv&gt;</text>
  <text x="716" y="656" class="s">qa_id, prediction in test_qa.csv order; single letter,</text>
  <text x="716" y="674" class="s">sorted letter set (multi) or permutation (sequence).</text>
  <text x="716" y="692" class="s">Kaggle 56255655: public 0.99707, private 0.98529</text>
  <text x="716" y="710" class="s">(top private score, tied with one team)</text>

  <path d="M1017,578 L1017,596 L340,596 L340,608" class="line"/>
  <path d="M650,670 L698,670" class="line"/>
</svg>
